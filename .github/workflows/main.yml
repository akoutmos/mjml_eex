name: MJML EEx CI

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SHELL: sh

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  static_analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.4"
          otp-version: "28.2"
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-deps-v3-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-deps-v3-
      - name: Install dependencies
        run: mix deps.get
      - name: Restore PLT cache
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-v3-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-v3-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - name: Mix Formatter
        run: mix format --check-formatted
      - name: Check for compiler warnings
        run: mix compile --warnings-as-errors
      - name: Credo strict checks
        run: mix credo --strict
      - name: Doctor documentation checks
        run: mix doctor
      - name: Dialyzer
        run: mix dialyzer --format github
      - name: Docs build without warnings
        run: mix docs --warnings-as-errors

  unit_test:
    name: Tests (Elixir ${{ matrix.version.elixir }}, OTP ${{ matrix.version.otp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version:
          - otp: "27"
            elixir: "1.18"
          - otp: "28"
            elixir: "1.18"
          - otp: "28"
            elixir: "1.19"
          - otp: "28"
            elixir: "1.20"
          - otp: "29"
            elixir: "1.20"
            coverage: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.version.elixir }}
          otp-version: ${{ matrix.version.otp }}
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-deps-v3-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-deps-v3-
      - name: Install dependencies
        run: mix deps.get
      # Templates compile inside the test modules, so this also catches warnings in the code
      # the template engine generates on newer Elixir versions
      - name: ExUnit tests
        if: ${{ !matrix.version.coverage }}
        env:
          MIX_ENV: test
        run: mix test --warnings-as-errors
      - name: ExUnit tests with coverage
        if: ${{ matrix.version.coverage }}
        env:
          MIX_ENV: test
          SHELL: /bin/bash
        run: mix coveralls.github --warnings-as-errors
